# Installed by `pleb install` on a standalone (non-Plebian-OS) system.
# With no session policy running (greeter, console) closing the lid does
# nothing. In a Pleb session xfce4-power-manager holds the lid inhibitor and its
# setting decides: run `pleb devices power` to choose Lock or Suspend.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
